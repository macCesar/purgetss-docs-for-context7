name: Refresh Context7 documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'context7.json'
      - '.github/workflows/context7-refresh.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: context7-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Request documentation refresh
        env:
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
        run: |
          if [ -z "$CONTEXT7_API_KEY" ]; then
            echo '::error::Add CONTEXT7_API_KEY in repository Settings > Secrets and variables > Actions.'
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --connect-timeout 15 --max-time 120 \
            --request POST 'https://context7.com/api/v1/refresh' \
            --header "Authorization: Bearer $CONTEXT7_API_KEY" \
            --header 'Content-Type: application/json' \
            --data '{"libraryName":"/maccesar/purgetss-docs-for-context7"}'
          echo
          echo 'Refresh requested. Context7 completes indexing asynchronously.'
